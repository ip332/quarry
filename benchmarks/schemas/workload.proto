syntax = "proto3";

package benchmark.workload;

enum Status {
  STATUS_IDLE = 0;
  STATUS_ACTIVE = 1;
  STATUS_FAULT = 2;
}

// Presence mirrors the Quarry schemas (workload.brd, workload_shared.brd):
// Quarry scalars and enums have explicit presence, so a present zero/false is
// encoded and decoded as present; `optional` gives Protobuf the same semantics.
// Quarry string/bytes/array presence is derived from length/count (empty
// encodes as absent), matching proto3 implicit presence, so those fields stay
// plain. Message fields already have explicit presence.
message Child {
  optional uint32 id = 1;
  string label = 2;
  bytes payload = 3;
}

message Workload {
  optional uint32 sequence = 1;
  optional uint64 timestamp = 2;
  optional uint64 counter = 3;
  optional float ratio = 4;
  optional bool enabled = 5;
  optional Status status = 6;
  string name = 7;
  bytes payload = 8;
  repeated uint32 values = 9;
  Child child = 10;
  repeated Child children = 11;
}
