syntax = "proto3";

package breadcrumbs.manifest;

// FieldType identifies the compiler-recognized field kind stored in the
// manifest.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_BOOL = 1;
  FIELD_TYPE_I8 = 2;
  FIELD_TYPE_U8 = 3;
  FIELD_TYPE_I16 = 4;
  FIELD_TYPE_U16 = 5;
  FIELD_TYPE_I32 = 6;
  FIELD_TYPE_U32 = 7;
  FIELD_TYPE_I64 = 8;
  FIELD_TYPE_U64 = 9;
  FIELD_TYPE_F32 = 10;
  FIELD_TYPE_F64 = 11;
  FIELD_TYPE_STRING = 12;
  FIELD_TYPE_BYTES = 13;
  FIELD_TYPE_RECORD = 14;
  FIELD_TYPE_ENUM = 15;
}

// Manifest stores compiler-managed persistent state for one resolved
// Breadcrumbs compilation.
message Manifest {
  // Manifest file format version. This is independent of any Breadcrumbs schema
  // version.
  uint32 manifest_version = 1;

  // Breadcrumbs Schema Compiler version that produced the manifest. Empty means
  // not provided.
  string compiler_version = 2;

  // Next recordId to allocate. This value is monotonically increasing and
  // prevents automatic reuse of record IDs.
  uint32 next_record_id = 3;

  // Root of the resolved namespace hierarchy.
  Namespace root_namespace = 4;
}

// Namespace represents a resolved schema namespace. Namespaces may be nested.
message Namespace {
  // Namespace segment name.
  string name = 1;

  // Child namespaces nested under this namespace.
  repeated Namespace namespaces = 2;

  // Records defined directly in this namespace.
  repeated Record records = 3;
}

// Record stores compiler-managed state for one record in the resolved
// namespace hierarchy.
message Record {
  // Record name within its containing namespace.
  string name = 1;

  // Compiler-assigned binary record identifier. This value is globally unique
  // within the manifest.
  uint32 record_id = 2;

  // Next fieldIndex to allocate within this record. This value is
  // monotonically increasing and prevents automatic reuse of field indexes.
  uint32 next_field_index = 3;

  // Optional compiler metadata used to detect changes to a record definition.
  // This is not part of record identity or compatibility. Empty means not
  // provided.
  string schema_hash = 4;

  // Current fields defined by this record.
  repeated Field fields = 5;
}

// Field stores compiler-managed state for one current field in a record.
message Field {
  // Field name as declared by the schema.
  string name = 1;

  // Compiler-assigned binary field index. This value is unique only within the
  // containing record.
  uint32 field_index = 2;

  // Compiler-recognized field kind.
  FieldType type = 3;

  // Fully qualified referenced record or enum name. This is used only when
  // type is FIELD_TYPE_RECORD or FIELD_TYPE_ENUM. Primitive fields leave this
  // empty.
  string referenced_type_fqn = 4;
}
