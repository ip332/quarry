name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build development image
        run: docker compose build

      - name: Configure
        run: docker compose run --rm dev cmake --preset debug

      - name: Build
        run: docker compose run --rm dev cmake --build --preset debug --parallel

      - name: Test
        run: docker compose run --rm dev ctest --preset debug --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build development image
        run: docker compose build

      - name: Configure
        run: docker compose run --rm dev cmake --preset debug-clang-tidy

      - name: Build
        run: docker compose run --rm dev cmake --build --preset debug-clang-tidy --parallel
