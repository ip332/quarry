name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure
        run: docker compose run --rm dev cmake --preset docker-debug -DQUARRY_INTEROP_REQUIRE_ALL=ON

      - name: Build
        run: docker compose run --rm dev cmake --build --preset docker-debug --parallel

      - name: Verify Git-derived version
        run: >-
          docker compose run --rm dev sh -c
          'set -eu;
          base=$(git log -1 --format=%H -- git_version);
          test -n "$base";
          revision=$(git rev-list --count "$base..HEAD");
          major_minor=$(tr -d "\n" < git_version);
          expected="$major_minor.$revision";
          compiler=$(build/docker-debug/tools/quarry-schema-compiler --version);
          translator=$(build/docker-debug/tools/schema-translators/protobuf/quarry-protobuf-translator --version);
          python_version=$(PYTHONPATH=runtime/python/src python3 -c "import quarry; print(quarry.__version__)");
          case "$compiler" in
          "quarry-schema-compiler $expected ("*|"quarry-schema-compiler $expected-dirty ("*) :;;
          *) exit 1;;
          esac;
          case "$translator" in
          "quarry-protobuf-translator $expected ("*|"quarry-protobuf-translator $expected-dirty ("*) :;;
          *) exit 1;;
          esac;
          test "$python_version" = "$expected"'

      - name: Test
        run: docker compose run --rm dev ctest --preset docker-debug --output-on-failure

      # The same black-box matrix under Linux Clang 18, including its C runtime
      # and generic C++ tooling probe. No second whole-project CTest suite.
      - name: Clang 18 interoperability matrix
        run: |
          docker compose run --rm dev sh -ec '
          clang-18 --version
          cmake --preset docker-debug -B build/clang18-matrix \
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
          -DQUARRY_INTEROP_REQUIRE_ALL=ON
          cmake --build build/clang18-matrix --target quarry_runtime_c interop_matrix_generic_cpp --parallel
          python3 tests/interop/matrix/run.py \
          --source . \
          --generic-cpp build/clang18-matrix/tests/interop_matrix_generic_cpp \
          --cc clang-18 --cxx clang++-18 \
          --build-dir build/docker-debug \
          --runtime-c build/clang18-matrix/runtime_c/libquarry_runtime_c.a \
          --work build/interop-clang18 --require-all'

      # Docker creates private temporary directories and Go's BRF files are
      # mode 0600. Give the host runner ownership before upload-artifact walks
      # the evidence; keep the test's normal file permissions intact.
      - name: Make interoperability evidence readable
        if: always()
        run: |
          for path in build/docker-debug/interop-matrix build/interop-clang18; do
            if [ -d "$path" ]; then
              sudo chown -R "$USER":"$USER" "$path"
            fi
          done

      - name: Upload interoperability matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarry-interop-matrix
          path: |
            build/docker-debug/interop-matrix/report.json
            build/docker-debug/interop-matrix/run-*/commands.log
            build/docker-debug/interop-matrix/run-*/*.brf
            build/interop-clang18/report.json
            build/interop-clang18/run-*/commands.log
            build/interop-clang18/run-*/*.brf

      # Small secondary diagnostic; runtime assertions are still required.
      - name: GCC LTO generated identity validation
        run: >-
          docker compose run --rm dev python3 scripts/quarry-identity-validate matrix
          --toolchain gcc g++ gcc --profiles lto --require-supported
          --test-binary build/docker-debug/tests/generated_code_identity_integration_test
          --output build/identity-lto

      - name: Upload identity LTO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarry-identity-lto
          path: build/identity-lto

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure
        run: docker compose run --rm dev cmake --preset docker-debug-clang-tidy

      - name: Build
        run: docker compose run --rm dev cmake --build --preset docker-debug-clang-tidy --parallel

  cortex-m:
    name: Cortex-M Cross Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure host tools
        run: docker compose run --rm dev cmake --preset docker-debug

      - name: Build host schema compiler
        run: >-
          docker compose run --rm dev
          cmake --build --preset docker-debug --target quarry_schema_compiler

      - name: Report ARM toolchain version
        run: docker compose run --rm dev arm-none-eabi-gcc --version

      - name: Configure Cortex-M cross build
        run: >-
          docker compose run --rm dev sh -c '
          cmake -S cortex_m -B cortex_m/build
          -DCMAKE_TOOLCHAIN_FILE=$(pwd)/cmake/toolchains/arm-cortex-m4.cmake
          -DQUARRY_HOST_SCHEMA_COMPILER=$(pwd)/build/docker-debug/tools/quarry-schema-compiler
          -DQUARRY_RUNTIME_C_INCLUDE_DIR=$(pwd)/include
          -DQUARRY_RUNTIME_C_VERSION_HEADER_DIR=$(pwd)/build/docker-debug/generated'

      - name: Build Cortex-M smoke target
        run: docker compose run --rm dev cmake --build cortex_m/build --parallel

      - name: Report footprint
        run: >-
          docker compose run --rm dev
          python3 cortex_m/scripts/report_footprint.py
          --elf cortex_m/build/quarry_cortex_m_smoke.elf
          --object generated_workload=cortex_m/build/CMakeFiles/quarry_cortex_m_smoke.dir/generated/benchmark/workload.generated.c.obj
          --object generated_shared=cortex_m/build/CMakeFiles/quarry_cortex_m_smoke.dir/generated/benchmark/workload/shared.generated.c.obj
          --object typed_runtime=cortex_m/build/libquarry_cortex_m_codec.a
          --object smoke=cortex_m/build/CMakeFiles/quarry_cortex_m_smoke.dir/smoke/workload_smoke.c.obj
          --object startup=cortex_m/build/CMakeFiles/quarry_cortex_m_smoke.dir/startup_cortex_m4.c.obj
          --json cortex_m/build/footprint.json
          >> "$GITHUB_STEP_SUMMARY"

      # Informational: the cost of explicitly reading the configuration
      # identity through the generated accessor (quarry_cortex_m_smoke_identity)
      # relative to the plain smoke ELF, which must carry no identity code or data.
      - name: Report identity access footprint
        run: >-
          docker compose run --rm dev
          python3 cortex_m/scripts/report_footprint.py
          --elf cortex_m/build/quarry_cortex_m_smoke_identity.elf
          --label "smoke + identity accessor"
          --baseline-json cortex_m/build/footprint.json
          --baseline-label "smoke"
          --json cortex_m/build/footprint-identity.json
          >> "$GITHUB_STEP_SUMMARY"

      # Informational, pull requests only: the same smoke target built with the
      # base commit's schema compiler, runtime and Cortex-M project under the
      # identical image, toolchain file and flags, compared section by section.
      - name: Compare footprint with base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          docker compose run --rm -e BASE_SHA dev sh -ec '
          git worktree add --detach .footprint-base "$BASE_SHA";
          cd .footprint-base;
          cmake --preset docker-debug;
          cmake --build --preset docker-debug --target quarry_schema_compiler;
          cmake -S cortex_m -B cortex_m/build
          -DCMAKE_TOOLCHAIN_FILE=$(pwd)/cmake/toolchains/arm-cortex-m4.cmake
          -DQUARRY_HOST_SCHEMA_COMPILER=$(pwd)/build/docker-debug/tools/quarry-schema-compiler
          -DQUARRY_RUNTIME_C_INCLUDE_DIR=$(pwd)/include
          -DQUARRY_RUNTIME_C_VERSION_HEADER_DIR=$(pwd)/build/docker-debug/generated;
          cmake --build cortex_m/build --parallel --target quarry_cortex_m_smoke;
          cd ..;
          python3 cortex_m/scripts/report_footprint.py
          --elf .footprint-base/cortex_m/build/quarry_cortex_m_smoke.elf
          --json cortex_m/build/footprint-base.json > /dev/null;
          python3 cortex_m/scripts/report_footprint.py
          --elf cortex_m/build/quarry_cortex_m_smoke.elf
          --label "pull request"
          --baseline-json cortex_m/build/footprint-base.json
          --baseline-label "base $BASE_SHA"
          --json cortex_m/build/footprint-vs-base.json'
          >> "$GITHUB_STEP_SUMMARY"

      # Informational, pull requests only: section sizes do not show whether
      # generated machine code changed. Builds the Cortex-M project from the
      # base commit (prepared above) and from the pull request with the same
      # image, toolchain file and flags, in the default configuration, at -Os
      # (MinSizeRel) and with debug information (Debug), and compares every
      # allocatable byte, relocation and defined symbol of each ELF and object.
      - name: Compare generated machine code with base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: >-
          set -o pipefail;
          docker compose run --rm -e BASE_SHA dev sh -ec '
          for config in Default MinSizeRel Debug; do
          for side in base candidate; do
          if [ "$side" = base ]; then root=$(pwd)/.footprint-base; else root=$(pwd); fi;
          build_type=""; if [ "$config" != Default ]; then build_type="-DCMAKE_BUILD_TYPE=$config"; fi;
          cmake -S "$root/cortex_m" -B "build/machine-code/$side-$config" $build_type
          -DCMAKE_TOOLCHAIN_FILE="$root/cmake/toolchains/arm-cortex-m4.cmake"
          -DQUARRY_HOST_SCHEMA_COMPILER="$root/build/docker-debug/tools/quarry-schema-compiler"
          -DQUARRY_RUNTIME_C_INCLUDE_DIR="$root/include"
          -DQUARRY_RUNTIME_C_VERSION_HEADER_DIR="$root/build/docker-debug/generated" > /dev/null;
          cmake --build "build/machine-code/$side-$config" --parallel > /dev/null;
          done;
          python3 cortex_m/scripts/compare_machine_code.py
          --base "build/machine-code/base-$config"
          --candidate "build/machine-code/candidate-$config"
          --label "$config" --base-label "base $BASE_SHA" --candidate-label "pull request";
          done'
          | tee machine-code-report.md >> "$GITHUB_STEP_SUMMARY";
          cat machine-code-report.md

      - name: Compare equivalent C storage policies
        shell: bash
        run: >-
          set -o pipefail;
          docker compose run --rm dev sh -ec '
          for config in Default MinSizeRel Debug; do
          for policy in global explicit; do
          if [ "$policy" = global ]; then selection=ALL;
          else selection=benchmark.workload.shared,benchmark.workload; fi;
          build_type=""; if [ "$config" != Default ]; then build_type="-DCMAKE_BUILD_TYPE=$config"; fi;
          cmake -S cortex_m -B "build/storage-policy/$policy-$config" $build_type
          -DCMAKE_TOOLCHAIN_FILE="$(pwd)/cmake/toolchains/arm-cortex-m4.cmake"
          -DQUARRY_HOST_SCHEMA_COMPILER="$(pwd)/build/docker-debug/tools/quarry-schema-compiler"
          -DQUARRY_RUNTIME_C_INCLUDE_DIR="$(pwd)/include"
          -DQUARRY_RUNTIME_C_VERSION_HEADER_DIR="$(pwd)/build/docker-debug/generated"
          -DQUARRY_C_OPTIMIZE_SIZE="$selection" > /dev/null;
          cmake --build "build/storage-policy/$policy-$config" --parallel > /dev/null;
          done;
          python3 cortex_m/scripts/compare_machine_code.py
          --base "build/storage-policy/global-$config"
          --candidate "build/storage-policy/explicit-$config"
          --label "Equivalent storage policies ($config)" --strict;
          done'
          | tee storage-policy-report.md >> "$GITHUB_STEP_SUMMARY";
          cat storage-policy-report.md

      - name: Compare explicit naming prefix
        shell: bash
        run: >-
          set -o pipefail;
          docker compose run --rm dev sh -ec '
          for config in Default MinSizeRel Debug; do
          for side in plain prefixed; do
          prefix=OFF; if [ "$side" = prefixed ]; then prefix=ON; fi;
          build_type=""; if [ "$config" != Default ]; then build_type="-DCMAKE_BUILD_TYPE=$config"; fi;
          cmake -S cortex_m -B "build/name-prefix/$side-$config" $build_type
          -DCMAKE_TOOLCHAIN_FILE="$(pwd)/cmake/toolchains/arm-cortex-m4.cmake"
          -DQUARRY_HOST_SCHEMA_COMPILER="$(pwd)/build/docker-debug/tools/quarry-schema-compiler"
          -DQUARRY_RUNTIME_C_INCLUDE_DIR="$(pwd)/include"
          -DQUARRY_RUNTIME_C_VERSION_HEADER_DIR="$(pwd)/build/docker-debug/generated"
          -DQUARRY_SMOKE_PREFIXED=$prefix > /dev/null;
          cmake --build "build/name-prefix/$side-$config" --parallel > /dev/null;
          arm-none-eabi-nm -S --defined-only "build/name-prefix/$side-$config/quarry_cortex_m_smoke.elf"
          > "build/name-prefix/$side-$config-symbols.txt";
          done;
          python3 cortex_m/scripts/compare_machine_code.py
          --base "build/name-prefix/plain-$config" --candidate "build/name-prefix/prefixed-$config"
          --label "$config" --base-label "unprefixed" --candidate-label "name-prefix rev_a";
          done' | tee name-prefix-report.md >> "$GITHUB_STEP_SUMMARY";
          cat name-prefix-report.md

      - name: Upload footprint report
        uses: actions/upload-artifact@v4
        with:
          name: quarry-cortex-m-footprint
          path: |
            cortex_m/build/footprint*.json
            machine-code-report.md
            storage-policy-report.md
            name-prefix-report.md
            build/name-prefix/*-symbols.txt

  coverage:
    name: Coverage baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure coverage build
        run: docker compose run --rm dev cmake --preset docker-coverage

      - name: Build coverage targets
        run: docker compose run --rm dev cmake --build --preset docker-coverage --parallel

      - name: Run coverage test suite
        run: >-
          docker compose run --rm dev ctest --preset docker-coverage
          -E "backend_codegen_test|runtime_package_consumer_test|schema_compiler_install_test|schema_compiler_package_test|public_examples_test"
          --output-on-failure

      - name: Collect native coverage
        run: >-
          docker compose run --rm dev sh -c
          'mkdir -p coverage && gcovr --root . --object-directory build/docker-coverage
          --filter "^(compiler|include|tools/schema-translators/protobuf)/.*"
          --exclude ".*tests.*" --exclude ".*generated.*" --exclude ".*_deps.*"
          --merge-mode-functions merge-use-line-min
          --json-summary-pretty --json-summary coverage/native.json
          --html-details coverage/native.html --txt coverage/native.txt'

      - name: Collect Python runtime coverage
        run: >-
          docker compose run --rm dev sh -c
          'PYTHONPATH=runtime/python/src python3 -m coverage run --branch --source=runtime/python/src
          -m unittest discover -s runtime/python/tests &&
          python3 -m coverage json -o coverage/python.json &&
          python3 -m coverage html -d coverage/python-html'

      - name: Enforce coverage baseline
        run: >-
          docker compose run --rm dev python3 tools/coverage_guard.py
          --native coverage/native.json --python coverage/python.json
          --baseline tools/coverage_baseline.json --write coverage/current.json

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: quarry-coverage
          path: coverage/

  benchmarks:
    name: Benchmarks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure release benchmark harness
        run: docker compose run --rm dev cmake --preset docker-benchmark

      - name: Build benchmark harnesses
        run: >-
          docker compose run --rm dev cmake --build --preset docker-benchmark
          --target quarry_benchmark_cpp quarry_benchmark_c
          quarry_benchmark_protobuf_cpp quarry_benchmark_protobuf_cpp_arena --parallel

      - name: Run and publish benchmark report
        run: |
          docker compose run --rm dev sh -c '
          set -eu
          rm -rf benchmark-results quarry-benchmark-results quarry-benchmark-results-repeat
          mkdir -p benchmark-results
          for run in 001 002 003 004 005; do
            python3 benchmarks/scripts/run_benchmarks.py --build-dir build/docker-benchmark --case all --backend all --operation all --output-dir benchmark-results/run-$run
          done
          python3 benchmarks/scripts/generate_benchmark_report.py --input benchmark-results/run-001 benchmark-results/run-002 benchmark-results/run-003 benchmark-results/run-004 benchmark-results/run-005 --output quarry-benchmark-results
          python3 benchmarks/scripts/generate_benchmark_report.py --input benchmark-results/run-001 benchmark-results/run-002 benchmark-results/run-003 benchmark-results/run-004 benchmark-results/run-005 --output quarry-benchmark-results-repeat
          diff -r quarry-benchmark-results quarry-benchmark-results-repeat
          rm -rf quarry-benchmark-results-repeat
          python3 benchmarks/scripts/generate_benchmark_report.py --input benchmark-results/run-001 benchmark-results/run-002 benchmark-results/run-003 benchmark-results/run-004 benchmark-results/run-005 --output validation-output --validation-only
          rm -rf validation-output'

      - name: Make benchmark outputs readable
        run: sudo chown -R "$USER":"$USER" benchmark-results quarry-benchmark-results

      - name: Add benchmark overview to job summary
        run: sed -n '1,42p' quarry-benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: quarry-benchmark-results-${{ github.sha }}
          path: quarry-benchmark-results/
          if-no-files-found: error
