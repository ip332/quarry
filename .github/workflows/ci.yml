name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure
        run: docker compose run --rm dev cmake --preset docker-debug

      - name: Build
        run: docker compose run --rm dev cmake --build --preset docker-debug --parallel

      - name: Verify Git-derived version
        run: >-
          docker compose run --rm dev sh -c
          'set -eu;
          base=$(git log -1 --format=%H -- git_version);
          test -n "$base";
          revision=$(git rev-list --count "$base..HEAD");
          major_minor=$(tr -d "\n" < git_version);
          expected="$major_minor.$revision";
          compiler=$(build/docker-debug/tools/quarry-schema-compiler --version);
          translator=$(build/docker-debug/tools/schema-translators/protobuf/quarry-protobuf-translator --version);
          python_version=$(PYTHONPATH=runtime/python/src python3 -c "import quarry; print(quarry.__version__)");
          case "$compiler" in
          "quarry-schema-compiler $expected ("*|"quarry-schema-compiler $expected-dirty ("*) :;;
          *) exit 1;;
          esac;
          case "$translator" in
          "quarry-protobuf-translator $expected ("*|"quarry-protobuf-translator $expected-dirty ("*) :;;
          *) exit 1;;
          esac;
          test "$python_version" = "$expected"'

      - name: Test
        run: docker compose run --rm dev ctest --preset docker-debug --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure
        run: docker compose run --rm dev cmake --preset docker-debug-clang-tidy

      - name: Build
        run: docker compose run --rm dev cmake --build --preset docker-debug-clang-tidy --parallel

  coverage:
    name: Coverage baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure coverage build
        run: docker compose run --rm dev cmake --preset docker-coverage

      - name: Build coverage targets
        run: docker compose run --rm dev cmake --build --preset docker-coverage --parallel

      - name: Run coverage test suite
        run: >-
          docker compose run --rm dev ctest --preset docker-coverage
          -E "backend_codegen_test|runtime_package_consumer_test|schema_compiler_install_test|schema_compiler_package_test|public_examples_test"
          --output-on-failure

      - name: Collect native coverage
        run: >-
          docker compose run --rm dev sh -c
          'mkdir -p coverage && gcovr --root . --object-directory build/docker-coverage
          --filter "^(compiler|include|tools/schema-translators/protobuf)/.*"
          --exclude ".*tests.*" --exclude ".*generated.*" --exclude ".*_deps.*"
          --merge-mode-functions merge-use-line-min
          --json-summary-pretty --json-summary coverage/native.json
          --html-details coverage/native.html --txt coverage/native.txt'

      - name: Collect Python runtime coverage
        run: >-
          docker compose run --rm dev sh -c
          'PYTHONPATH=runtime/python/src python3 -m coverage run --branch --source=runtime/python/src
          -m unittest discover -s runtime/python/tests &&
          python3 -m coverage json -o coverage/python.json &&
          python3 -m coverage html -d coverage/python-html'

      - name: Enforce coverage baseline
        run: >-
          docker compose run --rm dev python3 tools/coverage_guard.py
          --native coverage/native.json --python coverage/python.json
          --baseline tools/coverage_baseline.json --write coverage/current.json

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: quarry-coverage
          path: coverage/

  benchmarks:
    name: Benchmarks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development image
        run: docker compose build

      - name: Configure release benchmark harness
        run: docker compose run --rm dev cmake --preset docker-benchmark

      - name: Build benchmark harnesses
        run: >-
          docker compose run --rm dev cmake --build --preset docker-benchmark
          --target quarry_benchmark_cpp quarry_benchmark_c
          quarry_benchmark_protobuf_cpp quarry_benchmark_protobuf_cpp_arena --parallel

      - name: Run and publish benchmark report
        run: |
          docker compose run --rm dev sh -c '
          set -eu
          rm -rf benchmark-results quarry-benchmark-results quarry-benchmark-results-repeat
          mkdir -p benchmark-results
          for run in 001 002 003 004 005; do
            python3 benchmarks/scripts/run_benchmarks.py --build-dir build/docker-benchmark --case all --backend all --operation all --output-dir benchmark-results/run-$run
          done
          python3 benchmarks/scripts/generate_benchmark_report.py --input benchmark-results/run-001 benchmark-results/run-002 benchmark-results/run-003 benchmark-results/run-004 benchmark-results/run-005 --output quarry-benchmark-results
          python3 benchmarks/scripts/generate_benchmark_report.py --input benchmark-results/run-001 benchmark-results/run-002 benchmark-results/run-003 benchmark-results/run-004 benchmark-results/run-005 --output quarry-benchmark-results-repeat
          diff -r quarry-benchmark-results quarry-benchmark-results-repeat
          rm -rf quarry-benchmark-results-repeat
          python3 benchmarks/scripts/generate_benchmark_report.py --input benchmark-results/run-001 benchmark-results/run-002 benchmark-results/run-003 benchmark-results/run-004 benchmark-results/run-005 --output validation-output --validation-only
          rm -rf validation-output'

      - name: Add benchmark overview to job summary
        run: sed -n '1,42p' quarry-benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: quarry-benchmark-results-${{ github.sha }}
          path: quarry-benchmark-results/
          if-no-files-found: error
