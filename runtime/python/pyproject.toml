[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-runtime-python"
dynamic = ["version"]
description = "Quarry generated-code compatibility runtime for generated Python BRF codecs."
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Quarry contributors"}]

[project.optional-dependencies]
test = ["build>=1.2", "setuptools>=68"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "quarry._version.__version__"}
