[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-runtime-python"
version = "0.1.0"
description = "Quarry generated-code compatibility runtime for generated Python BRF codecs."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
