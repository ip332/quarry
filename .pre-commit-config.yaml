default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        stages:
          - pre-commit
      - id: trailing-whitespace
        stages:
          - pre-commit
      - id: check-yaml
        stages:
          - pre-commit
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: '^(compiler|tests)/.*\.(cpp|hpp)$'
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: cmake-configure-debug
        name: cmake configure debug
        entry: cmake --preset debug
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
      - id: cmake-build-debug
        name: cmake build debug
        entry: cmake --build --preset debug
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
      - id: ctest-debug
        name: ctest debug
        entry: ctest --preset debug
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
