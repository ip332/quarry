# The pre-push hook is not managed by pre-commit: pre-commit passes hooks only
# the first outgoing ref. Install it with `scripts/quarry-validate install-hook`
# (see CONTRIBUTING.md and issue #89).
default_install_hook_types:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        stages:
          - pre-commit
      - id: trailing-whitespace
        stages:
          - pre-commit
      - id: check-yaml
        stages:
          - pre-commit
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: '^(compiler|tests)/.*\.(cpp|hpp)$'
        stages:
          - pre-commit
  - repo: local
    hooks:
      # A pre-commit-generated pre-push hook from before #89 lands here. Fail
      # closed instead of pushing unvalidated commits.
      - id: quarry-pre-push-hook-not-installed
        name: quarry pre-push receipt check
        entry: >-
          The Quarry pre-push hook is not installed. Run
          `scripts/quarry-validate install-hook`, then validate and push with
          `scripts/quarry-validate push <git push arguments>` (CONTRIBUTING.md).
        language: fail
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
